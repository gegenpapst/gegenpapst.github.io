<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Musik — stuettgen.eu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style> body { font-family: 'Courier New', monospace; } </style>
</head>
<body class="bg-[#0d0d0d] text-[#e0e0e0] min-h-screen p-8">

<div x-data="{
  search: '',
  filter: 'all',
  get artists() {
    const seen = new Set();
    const result = [{ id: 'all', label: 'Alle' }];
    this.videos.forEach(v => {
      if (!seen.has(v.artist)) { seen.add(v.artist); result.push({ id: v.artist, label: v.artist }); }
    });
    return result;
  },
  videos: [
    { artist: 'Blur',                     title: 'Song 2',              id: 'SSbBvKaM6sk' },
    { artist: 'Queens of the Stone Age',  title: 'I Sat by the Ocean (Live)', id: '4E4S0XWPMgQ' },
    { artist: 'Queens of the Stone Age',  title: 'Go with the Flow',   id: 'DcHKOC64KnE' },
    { artist: 'Red Hot Chili Peppers',    title: 'Californication',     id: 'YlUKcNNmywk' },
    { artist: 'Red Hot Chili Peppers',    title: 'Under the Bridge',   id: 'GLvohMXgcBo' },
    { artist: 'Jimi Hendrix',             title: 'The Wind Cries Mary', id: '1AyVXGHxHec' },
    { artist: 'Kings of Leon',            title: 'Pyro',                id: 'IoKfkQ4SdEQ' },
    { artist: 'Interpol',                 title: 'Obstacle 1',          id: 'DG--dQMdiQI', tab: 'https://drive.google.com/drive/folders/1HyfWcR0PnJkeH3r5WjU4l-RznpMg4mfL' },
    { artist: 'The Police',               title: 'Message in a Bottle', id: 'MbXWrmQW-OE' },
    { artist: 'The White Stripes',        title: 'Seven Nation Army',   id: '0J2QdDbelmY' },
    { artist: 'Rage Against the Machine', title: 'Bombtrack',           id: 'MUaL1FnotRQ' },
    { artist: 'Rage Against the Machine', title: 'Killing in the Name', id: 'bWXazVhlyxQ' },
    { artist: 'Bloc Party',               title: 'Helicopter',          id: '2R6S5CJWlco' },
    { artist: 'Danzig',                   title: 'Mother',              id: 'vPzfKe_G4Ng' },
    { artist: 'Ramones',                  title: 'Blitzkrieg Bop',                    id: 'skdE0KAFCEA' },
    { artist: 'Ton Steine Scherben',      title: 'Die letzte Schlacht gewinnen wir',  id: 'pW5w6BF1OwU' },
    { artist: 'Jimi Hendrix',             title: 'Hey Joe (Guitar Lesson)',           id: 'OKezvpuyYdY' },
  ],
  get filtered() {
    const q = this.search.toLowerCase().trim();
    const counts = {};
    this.videos.forEach(v => counts[v.artist] = (counts[v.artist] || 0) + 1);
    return this.videos
      .filter(v => {
        const matchesFilter = this.filter === 'all' || v.artist === this.filter;
        const matchesSearch = !q || v.artist.toLowerCase().includes(q) || v.title.toLowerCase().includes(q);
        return matchesFilter && matchesSearch;
      })
      .sort((a, b) => {
        if (counts[b.artist] !== counts[a.artist]) return counts[b.artist] - counts[a.artist];
        return a.artist.localeCompare(b.artist);
      });
  }
}">

  <!-- Nav -->
  <div class="flex items-center mb-6">
    <a href="index.html" class="text-xs tracking-widest text-[#555] hover:text-[#e0c86c] no-underline transition-colors">← zurück</a>
  </div>

  <!-- Artist filter -->
  <div class="flex flex-wrap gap-2 mb-6">
    <template x-for="a in artists" :key="a.id">
      <button
        @click="filter = a.id"
        :class="filter === a.id
          ? 'bg-white text-black'
          : 'bg-[#1a1a1a] text-[#888] hover:text-white border border-[#333] hover:border-[#666]'"
        class="px-3 py-1 text-xs tracking-widest uppercase transition-all duration-150"
        x-text="a.label">
      </button>
    </template>
  </div>

  <!-- Search -->
  <div class="flex items-center gap-2 mb-8">
    <input
      x-model="search"
      type="text"
      placeholder="Suche…"
      class="bg-[#1a1a1a] border border-[#333] text-[#e0e0e0] text-xs px-3 py-1.5 tracking-wide
             focus:outline-none focus:border-[#e0c86c] transition-colors w-48"
    />
    <span class="text-xs text-[#444]" x-text="filtered.length + ' / ' + videos.length"></span>
  </div>

  <!-- No results -->
  <div x-show="filtered.length === 0" class="text-center text-[#444] tracking-widest text-sm mt-20">
    KEINE TREFFER FÜR "<span x-text="search" class="text-[#666]"></span>"
  </div>

  <!-- Video grid -->
  <div class="grid grid-cols-[repeat(auto-fill,minmax(480px,1fr))] gap-7 max-w-6xl mx-auto">
    <template x-for="v in filtered" :key="v.id">
      <div class="bg-[#1a1a1a] border border-[#2a2a2a] hover:border-[#e0c86c] transition-colors duration-200">
        <!-- Meta -->
        <div class="px-4 py-3 border-b border-[#222] flex items-start justify-between gap-2">
          <div>
            <div class="text-[0.7rem] tracking-widest uppercase text-[#e0c86c] mb-1" x-text="v.artist"></div>
            <div class="text-base tracking-wide text-white" x-text="v.title"></div>
          </div>
          <a :href="v.tab || 'https://www.ultimate-guitar.com/search.php?search_type=title&value=' + encodeURIComponent(v.artist + ' ' + v.title)"
             target="_blank" rel="noopener"
             class="text-[0.65rem] tracking-widest text-[#444] hover:text-[#e0c86c] no-underline transition-colors shrink-0 mt-1">
            TAB ↗
          </a>
        </div>
        <!-- Embed -->
        <div class="relative w-full" style="padding-bottom: 56.25%">
          <iframe
            :src="'https://www.youtube.com/embed/' + v.id"
            :title="v.artist + ' – ' + v.title"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            class="absolute inset-0 w-full h-full border-0"
          ></iframe>
        </div>
      </div>
    </template>
  </div>

  <!-- Footer -->
  <footer class="text-center mt-12 pt-6 border-t border-[#222] text-[0.7rem] tracking-widest text-[#444]">
    <a href="index.html" class="text-[#555] hover:text-[#e0c86c] no-underline transition-colors">
      ← stuettgen.eu/a
    </a>
    <span class="mx-3">·</span>
    <span x-text="videos.length + ' videos'"></span>
  </footer>

</div>
</body>
</html>
